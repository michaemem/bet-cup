name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:wrangler
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Materialize .dev.vars for wrangler dev
        run: |
          cat > .dev.vars <<'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          EOF
      - name: Boot wrangler dev against build artifact and smoke-test
        run: |
          set -euo pipefail
          npx wrangler dev --port 8788 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          WRANGLER_PID=$!
          echo "wrangler dev PID: $WRANGLER_PID"
          trap "kill $WRANGLER_PID 2>/dev/null || true" EXIT
          # Wait up to 60s for the server to come up.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8788/auth/signin; then
              echo "wrangler dev ready after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "FAIL: wrangler dev did not respond within 60s"
              cat wrangler-dev.log
              exit 1
            fi
            sleep 1
          done
          # Test 1: /auth/signin renders 200.
          curl -sfI http://127.0.0.1:8788/auth/signin > /dev/null
          echo "OK: /auth/signin returned 200"
          # Test 2: /dashboard redirects to /auth/signin when unauthenticated.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8788/dashboard)
          if [ "$STATUS" != "302" ]; then
            echo "FAIL: /dashboard expected 302, got $STATUS"
            cat wrangler-dev.log
            exit 1
          fi
          echo "OK: /dashboard redirected (302)"

  # Live-DB RLS gate. Boots a real local Supabase stack so the blindness
  # invariant (S-03, FR-015/FR-017) and the matches edit-lock are continuously
  # proven on every push/PR — the default `ci` job has no Supabase, so the
  # `*.rls.test.ts` suites self-skip there. Keeps the blindness guarantee from
  # silently regressing.
  rls:
    runs-on: ubuntu-latest
    env:
      ADMIN_EMAIL: admin@betcup.local
      ADMIN_PASSWORD: local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` (>= v2.107.0) defaults the local stack to asymmetric
          # ES256 JWT signing keys, which the RLS test harness' authenticated
          # requests don't carry — PostgREST falls back to `anon`, so every
          # admin-only write fails with `permission denied for table ...`.
          # 2.98.2 uses the legacy HS256 shared secret these tests rely on.
          # Lift this pin only once the suites support ES256 keys.
          version: 2.98.2
      - name: Generate local seed (admin user) from the template
        run: node scripts/seed-template.mjs
      - name: Start Supabase (applies migrations + seed)
        run: supabase start
      - name: Export Supabase connection env for the RLS tests
        # `supabase status -o env` emits shell-quoted values (KEY="value"); strip
        # the quotes before appending to $GITHUB_ENV, which stores the line
        # verbatim (an embedded-quote SUPABASE_URL is an invalid URL otherwise).
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL | sed 's/"//g' >> "$GITHUB_ENV"
      - name: Run live-DB RLS integration tests
        run: npm test -- rls

  # Browser-level E2E gate. Boots a real local Supabase stack (migrations + seed,
  # so the default `alice` viewer exists) and the Astro SSR app, then drives the
  # Risk #1 blindness flow end-to-end (auth → routing → SSR → RLS → DB → DOM) —
  # the rendered cross-participant surface the *.rls.test.ts suites can't reach.
  # Not yet in `deploy.needs`: promote it to a deploy gate once it's proven green
  # across a few real runs (this job has never executed in GitHub Actions).
  e2e:
    runs-on: ubuntu-latest
    env:
      ADMIN_EMAIL: admin@betcup.local
      ADMIN_PASSWORD: local-only
      E2E_PARTICIPANT_USERNAME: alice
      E2E_PARTICIPANT_PASSWORD: participant-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - uses: supabase/setup-cli@v1
        with:
          # Same pin + rationale as the `rls` job: 2.98.2 uses the legacy HS256
          # signing keys the authenticated Supabase clients in these tests rely on.
          version: 2.98.2
      - name: Generate local seed (admin + default e2e viewer) from the template
        run: node scripts/seed-template.mjs
      - name: Start Supabase (applies migrations + seed)
        run: supabase start
      - name: Export Supabase connection env (both the app and the specs read these)
        # auth.anon_key → SUPABASE_KEY: createClient() in the app and the spec both
        # read SUPABASE_URL / SUPABASE_KEY. Strip the shell-quoting supabase emits.
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_KEY | sed 's/"//g' >> "$GITHUB_ENV"
      - name: Materialize .dev.vars so `astro dev` (the Playwright webServer) targets local Supabase
        run: |
          cat > .dev.vars <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_KEY=$SUPABASE_KEY
          EOF
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run the Risk #1 blindness E2E (Playwright boots the app via webServer)
        run: npx playwright test prediction-blindness

  deploy:
    needs: [ci, smoke, rls]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
